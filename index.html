/* Универсальный калькулятор налога на прибыль */
function calcProfit(DR, RR, VD, VR, loss){
  const base = (DR + VD) - (RR + VR);
  let usedLoss = 0, nb = base;
  if(base > 0 && loss > 0){
    const limit = base * 0.5;
    usedLoss = Math.min(loss, limit);
    nb = base - usedLoss;
  }
  const tax = nb * 0.25;
  return {
    base, usedLoss, nb,
    tax, fb: nb*0.08, rb: nb*0.17,
    net: nb - tax,
    lossLeft: loss - usedLoss
  };
}

/* ---------- ЛОГИКА НДФЛ (прогрессия 2025) ---------- */
function ndflProgressive(income){
  const brackets = [
    {limit:2_400_000, rate:0.13},
    {limit:5_000_000, rate:0.15},
    {limit:20_000_000, rate:0.18},
    {limit:50_000_000, rate:0.20},
    {limit:Infinity,  rate:0.22}
  ];
  let tax = 0, prev = 0, detail = [];
  for(const b of brackets){
    if(income <= prev) break;
    const part = Math.min(income, b.limit) - prev;
    const t = part * b.rate;
    tax += t;
    detail.push({from:prev, to:Math.min(income,b.limit), rate:b.rate*100, tax:t});
    prev = b.limit;
  }
  return {tax, detail};
}
function runNdfl(){
  const income = +document.getElementById('f_income').value || 0;
  const ded = +document.getElementById('f_ded').value || 0;
  const taxable = Math.max(0, income - ded);
  const {tax, detail} = ndflProgressive(taxable);
  const out = document.getElementById('f_out');
  out.innerHTML = `
    <div class="row"><span>Доход:</span><b>${fmt(income)} руб.</b></div>
    <div class="row"><span>Вычеты:</span><b>${fmt(ded)} руб.</b></div>
    <div class="row"><span>Налоговая база:</span><b>${fmt(taxable)} руб.</b></div>
    ${detail.map(d=>`<div class="row"><span>${fmt(d.from)}–${fmt(d.to)} × ${d.rate}%:</span><b>${fmt(d.tax)} руб.</b></div>`).join('')}
    <div class="row"><span><b>Итого НДФЛ:</b></span><b>${fmt(tax)} руб.</b></div>
    <div class="row"><span>На руки:</span><b>${fmt(taxable - tax + ded)} руб.</b></div>
  `;
  out.classList.add('show');
}

/* ---------- РЕНДЕР ТЕСТОВ ---------- */
function buildTest(containerId, data, title){
  const c = document.getElementById(containerId);
  c.innerHTML = `<div class="card"><h2>${title} <span class="badge">${data.length} вопросов</span></h2>
    <div id="${containerId}_qs"></div>
    <button class="btn" onclick="checkTest('${containerId}', ${JSON.stringify(JSON.stringify(data))})">Проверить результат</button>
    <div class="result" id="${containerId}_res"></div>
  </div>`;
  const qs = document.getElementById(containerId + '_qs');
  data.forEach((item, qi)=>{
    const div = document.createElement('div');
    div.className = 'q';
    div.innerHTML = `<p><b>${qi+1}.</b> ${item.q}</p>` +
      item.o.map((opt, oi)=>`<div class="opt" data-q="${qi}" data-o="${oi}" onclick="pick(this, ${qi}, ${oi}, '${containerId}')">${String.fromCharCode(1040+oi)}) ${opt}</div>`).join('');
    qs.appendChild(div);
  });
  window[containerId + '_answers'] = {};
}
function pick(el, qi, oi, cid){
  const key = cid + '_answers';
  window[key][qi] = oi;
  const parent = el.parentElement;
  parent.querySelectorAll('.opt').forEach(o=>o.style.borderColor='#334155');
  el.style.borderColor = '#38bdf8';
}
function checkTest(cid, dataJson){
  const data = JSON.parse(dataJson);
  const ans = window[cid + '_answers'] || {};
  let correct = 0, total = data.length;
  const qs = document.getElementById(cid + '_qs');
  data.forEach((item, qi)=>{
    const block = qs.children[qi];
    const opts = block.querySelectorAll('.opt');
    opts.forEach((o, oi)=>{
      o.classList.add('locked');
      if(oi === item.a) o.classList.add('correct');
      if(oi === ans[qi] && oi !== item.a) o.classList.add('wrong');
    });
    if(ans[qi] === item.a) correct++;
  });
  const pct = Math.round(correct/total*100);
  const res = document.getElementById(cid + '_res');
  res.className = 'result show';
  res.style.background = pct >= 80 ? '#14532d' : pct >= 50 ? '#78350f' : '#7f1d1d';
  res.textContent = `Результат: ${correct} из ${total} (${pct}%)`;
}

/* ---------- ИНИЦИАЛИЗАЦИЯ ТЕСТОВ ---------- */
buildTest('test1', TEST1, '📝 Тест: Налог на прибыль');
buildTest('test2', TEST2, '📝 Тест: НДС');
buildTest('test3', TEST3, '📝 Тест: НДФЛ');
buildTest('final', FINAL, '🎯 Итоговый тест по всем темам');

show('theory', document.querySelector('nav button'));
