<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>История: Перестройка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>История</h1>
            <div class="tabs">
                <button class="tab-btn active" data-tab="learn">Учить</button>
                <button class="tab-btn" data-tab="cards">Карточки</button>
            </div>
        </div>
    </header>

    <main>
        <!-- Режим "Учить" -->
        <section id="learn-mode" class="mode active">
            <!-- Кнопка зафиксирована -->
            <button id="toggle-answers-btn" class="toggle-btn">Показать ответы</button>
            
            <div class="learn-list" id="learn-list">
                <!-- Сюда будут вставляться карточки с ответами -->
            </div>
        </section>

        <!-- Режим "Карточки" -->
        <section id="cards-mode" class="mode">
            <div class="progress-bar">
                <div class="progress-text" id="progress-text">0 / 0 · знал: 0</div>
                <div class="progress-line"><div class="progress-fill" id="progress-fill"></div></div>
            </div>

            <div class="card-container" id="card-container">
                <div class="flashcard" id="flashcard">
                    <div class="card-content">
                        <h2 id="card-question">Вопрос</h2>
                        <div id="card-answer" class="answer hidden"></div>
                    </div>
                    <button id="show-answer-btn" class="show-answer-btn">Показать ответ</button>
                </div>
            </div>

            <div class="controls">
                <button id="btn-know" class="ctrl-btn know">Знал (→)</button>
                <button id="btn-dont-know" class="ctrl-btn dont-know">Не знал (←)</button>
            </div>
            <p class="hint">Свайп влево — не знал · Свайп вправо — знал</p>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
