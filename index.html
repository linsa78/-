<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Налоги: теория и тесты (4.1–4.3)</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273449;
    --txt:#e2e8f0; --muted:#94a3b8; --acc:#38bdf8;
    --ok:#22c55e; --bad:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5}
  header{padding:20px;text-align:center;background:linear-gradient(135deg,#1e3a8a,#0f172a)}
  header h1{margin:0;font-size:22px}
  header p{margin:6px 0 0;color:var(--muted);font-size:13px}
  nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid #334155}
  nav button{padding:8px 14px;border:1px solid #334155;background:var(--card);color:var(--txt);border-radius:8px;cursor:pointer;font-size:14px}
  nav button.active{background:var(--acc);color:#0f172a;font-weight:600;border-color:var(--acc)}
  main{max-width:960px;margin:0 auto;padding:18px}
  section{display:none;animation:fade .25s}
  section.show{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  .card{background:var(--card);border:1px solid #334155;border-radius:12px;padding:16px;margin-bottom:14px}
  .card h2{margin:0 0 10px;font-size:18px;color:var(--acc)}
  .card h3{margin:14px 0 8px;font-size:15px;color:#fbbf24}
  table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
  th,td{border:1px solid #334155;padding:6px 8px;text-align:left;vertical-align:top}
  th{background:var(--card2);color:var(--acc)}
  code{background:#0b1220;padding:2px 6px;border-radius:4px;color:#7dd3fc;font-size:13px}
  ul{margin:6px 0;padding-left:22px}
  li{margin:3px 0}
  .q{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #334155}
  .q p{margin:0 0 8px;font-weight:500}
  .opt{display:block;padding:8px 10px;margin:5px 0;border:1px solid #334155;border-radius:8px;cursor:pointer;font-size:14px;transition:.15s}
  .opt:hover{border-color:var(--acc)}
  .opt.selected{border-color:var(--acc);background:#0b1220}
  .opt.correct{background:#14532d;border-color:var(--ok)}
  .opt.wrong{background:#7f1d1d;border-color:var(--bad)}
  .opt.locked{cursor:default}
  .btn{margin-top:12px;padding:10px 18px;border:none;border-radius:8px;background:var(--acc);color:#0f172a;font-weight:600;cursor:pointer;font-size:15px}
  .btn:hover{filter:brightness(1.1)}
  .result{padding:12px;border-radius:8px;text-align:center;font-weight:600;margin-top:10px;display:none}
  .result.show{display:block}
  .badge{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--card2);font-size:12px;color:var(--muted);margin-left:6px;font-weight:400}
</style>
</head>

const nav = document.getElementById('nav');
NAV.forEach((n,i)=>{

});
function show(id, btn){
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  document.querySelectorAll('section').forEach(s=>s.classList.remove('show'));
  const el = document.getElementById(id);
  if(el) el.classList.add('show');
  window.scrollTo({top:0,behavior:'smooth'});
}

      <li><b>Стандартные</b> — на детей, для отдельных категорий граждан.</li>

      <li><b>Имущественные</b> — при покупке жилья, продаже имущества.</li>

      <li><b>Инвестиционные</b> — по ИИС и операциям с ценными бумагами.</li>
    </ul>
    <h3>Порядок исчисления</h3>
    <p><code>НДФЛ = (Доход − Вычеты) × Ставка</code></p>
    <ul>
      <li>Работодатель (налоговый агент) удерживает НДФЛ при каждой выплате дохода.</li>
      <li>По итогам года физическое лицо подаёт декларацию 3-НДФЛ (при необходимости).</li>

`;

/* ======================= РЕНДЕР ТЕСТОВ ======================= */
function buildTest(containerId, data, title){
  const c = document.getElementById(containerId);
  c.innerHTML = `<h2>${title} <span class="badge">${data.length} вопросов</span></h2>
    <div id="${containerId}_qs"></div>
    <button class="btn" onclick="checkTest('${containerId}', ${JSON.stringify(JSON.stringify(data))})">Проверить результат</button>
    <div class="result" id="${containerId}_res"></div>`;
  const qs = document.getElementById(containerId + '_qs');
  data.forEach((item, qi)=>{
    const div = document.createElement('div');
    div.className = 'q';
    div.innerHTML = `<p><b>${qi+1}.</b> ${item.q}</p>` +
      item.o.map((opt, oi)=>`<div class="opt" data-q="${qi}" data-o="${oi}" onclick="pick(this, ${qi}, ${oi}, '${containerId}')">${String.fromCharCode(1040+oi)}) ${opt}</div>`).join('');
    qs.appendChild(div);
  });
  window[containerId + '_answers'] = {};
}
function pick(el, qi, oi, cid){
  if(el.classList.contains('locked')) return;
  const key = cid + '_answers';
  window[key][qi] = oi;
  const parent = el.parentElement;
  parent.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
  el.classList.add('selected');
}
function checkTest(cid, dataJson){
  const data = JSON.parse(dataJson);
  const ans = window[cid + '_answers'] || {};
  let correct = 0, total = data.length;
  const qs = document.getElementById(cid + '_qs');
  data.forEach((item, qi)=>{
    const block = qs.children[qi];
    const opts = block.querySelectorAll('.opt');
    opts.forEach((o, oi)=>{
      o.classList.add('locked');
      o.classList.remove('selected');
      if(oi === item.a) o.classList.add('correct');
      if(oi === ans[qi] && oi !== item.a) o.classList.add('wrong');
    });
    if(ans[qi] === item.a) correct++;
  });
  const pct = Math.round(correct/total*100);
  const res = document.getElementById(cid + '_res');
  res.className = 'result show';
  res.style.background = pct >= 80 ? '#14532d' : pct >= 50 ? '#78350f' : '#7f1d1d';
  res.textContent = `Результат: ${correct} из ${total} (${pct}%)`;
}

buildTest('q1_card', TEST1, '📝 Тест: Налог на прибыль');
buildTest('q2_card', TEST2, '📝 Тест: НДС');
buildTest('q3_card', TEST3, '📝 Тест: НДФЛ');
buildTest('qf_card', FINAL, '🎯 Итоговый тест по всем темам');

show('t1', document.querySelector('nav button'));
